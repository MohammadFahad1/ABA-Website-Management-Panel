version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aba_panel_web
    ports:
      - "8010:80"
    environment:
      - DB_HOST=db
      - DB_NAME=ahmedbawanyacade_sacc
      - DB_USER=ahmedbaw_sacc
      - DB_PASS=_xAzHN_x3wKJ
      - DB_PORT=3306
      - ADMIN_PASS=Bangla@123
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    container_name: aba_panel_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: ahmedbawanyacade_sacc
      MYSQL_USER: ahmedbaw_sacc
      MYSQL_PASSWORD: _xAzHN_x3wKJ
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  db_data:
